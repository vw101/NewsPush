name: AI Daily News Push

on:
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发
  repository_dispatch: # 核心点火源：由阿里云 FC 定时器(每天 09:00) 或飞书群 @机器人 消息点火
    types: [feishu_mention_news, scheduled_news]

jobs:
  daily-digest:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允许自动提交更新 history.json 与 archives 简报

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Aggregator & Feishu Push
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'openrouter/free' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID || 'oc_41144adb848366fd8a1ac77bc8d40d7d' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered manually via workflow_dispatch: running with --force..."
            python run.py --force
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Triggered on-demand via repository_dispatch..."
            TARGET_CHAT="${{ github.event.client_payload.chat_id }}"
            if [ -n "$TARGET_CHAT" ]; then
              echo "Target chat id: $TARGET_CHAT"
              python run.py --force --chat-id "$TARGET_CHAT"
            else
              python run.py --force
            fi
          else
            python run.py
          fi

      - name: Commit & Push Archives and History Cache
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ archives/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(archive): automated daily digest [skip ci]"
            git push
          fi
